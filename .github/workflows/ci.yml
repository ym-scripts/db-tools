name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - run: npm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgres: 15, mysql: "mysql:8.0" }
          - { postgres: 17, mysql: "mysql:8.4" }
          - { postgres: 17, mysql: "mariadb:11" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: shop }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: ${{ matrix.mysql }}
        env: { MYSQL_ROOT_PASSWORD: pw, MYSQL_DATABASE: shop, MARIADB_ROOT_PASSWORD: pw, MARIADB_DATABASE: shop }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw || mariadb-admin ping -h 127.0.0.1 -ppw" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL ${{ matrix.postgres }} client tools
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - run: bash test/e2e.sh
        env:
          PG_URL: postgres://postgres:pw@localhost:5432/shop
          MYSQL_URL: mysql://root:pw@127.0.0.1:3306/shop
